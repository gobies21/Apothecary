side="BOTH"

[[dependencies.apothecary]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side= "BOTH"

[modproperties.apothecary]
configuredBackground="minecraft:textures/block/stone_bricks.png"
