[[mixins]]
config = "apothecary.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mods]]
modId="apothecary"
version="1.5.0.6"
displayName="Apothecary"
authors="gobies"
description='''A potion expansion to liven up the alchemy experience in Minecraft!'''

[[dependencies.apothecary]]
modId="neoforge"
mandatory= true
versionRange="${neo_version_range}"
